<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/pic/snake-pics/favicon.png" />
    <title>NOT UR REGULAR SNAKE</title>
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="banner">
      <img src="./assets/pic/snake-pics/banner.jpg" alt="snake-banner" />
      <h1>Snake Game</h1>
      <img src="./assets/pic/snake-pics/banner.jpg" alt="snake-banner" />
    </header>
    <div class="game-board">
      <section class="controls">
        <h1>CONTROL PANEL</h1>
        <fieldset class="speed">
          <legend>SPEED</legend>
          <input type="radio" name="speed" id="slow" value="slow" checked />
          <label for="slow">Slow</label>
          <input type="radio" name="speed" id="med" value="med" />
          <label for="med">Med</label>
          <input type="radio" name="speed" id="fast" value="fast" />
          <label for="fast">Fast</label>
        </fieldset>
        <fieldset class="difficulty">
          <legend>DIFFICULTY</legend>
          <input
            type="radio"
            name="difficulty"
            id="easy"
            value="easy"
            checked
          />
          <label for="easy">Easy</label>
          <input type="radio" name="difficulty" id="medium" value="medium" />
          <label for="medium">Medium</label>
          <input type="radio" name="difficulty" id="hard" value="difficult" />
          <label for="difficult">Difficult</label>
        </fieldset>
        <fieldset class="sound">
          <legend>SOUND</legend>
          <input type="checkbox" name="sound" id="mute-sfx" value="sfx" />
          <label for="sfx">Mute SFX</label>
          <input type="checkbox" name="sound" id="mute-music" value="music" />
          <label for="music">Mute Music</label>
        </fieldset>
        <div class="buttons">
          <button class="restart">Restart</button>
          <button class="pause">Pause</button>
        </div>
      </section>
      <section class="game">
        <div class="grids">
          <div class="easy-grid">
            <div class="e">
              <div class="5 box"></div>
              <div class="4 box"></div>
              <div class="3 box"></div>
              <div class="2 box"></div>
              <div class="1 box"></div>
            </div>
            <div class="d">
              <div class="5 box"></div>
              <div class="4 box"></div>
              <div class="3 box"></div>
              <div class="2 box"></div>
              <div class="1 box"></div>
            </div>
            <div class="c">
              <div class="5 box"></div>
              <div class="4 box"></div>
              <div class="3 box"></div>
              <div class="2 box"></div>
              <div class="1 box"></div>
            </div>
            <div class="b">
              <div class="5 box"></div>
              <div class="4 box"></div>
              <div class="3 box"></div>
              <div class="2 box"></div>
              <div class="1 box"></div>
            </div>
            <div class="a">
              <div class="5 box"></div>
              <div class="4 box"></div>
              <div class="3 box"></div>
              <div class="2 box"></div>
              <div class="1 box"></div>
            </div>
          </div>
          <div class="medium-grid"></div>
          <div class="hard-grid"></div>
          <div class="easy-grid"></div>
        </div>
        <div class="state-block win">
          <h2 class="win-msg">Congratulations</h2>
          <button class="restart" id="restart">Play Again</button>
        </div>
        <div class="state-block lose">
          <h2 class="lose-msg">Hard Luck</h2>
          <button class="restart" id="restart">Play Again</button>
        </div>
      </section>
    </div>
  </body>
</html>
