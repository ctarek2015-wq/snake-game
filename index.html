<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/pic/snake-pics/favicon.png" />
    <title>NOT UR REGULAR SNAKE</title>
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="new-player-class" id="new-player">
      <h1>SNAKE GAME</h1>
      <div class="instructions">
        <h3>Instructions</h3>
        <ul>
          <li>Use arrows or (a,s,d,w) to move</li>
          <li>press Esc to pause the game</li>
        </ul>
      </div>
      <div class="intro">
        <input
          type="text"
          id="player-name"
          placeholder="Player Name"
          required
        />
        <button id="submit">Submit</button>
      </div>
    </div>
    <header class="banner">
      <h1>Snake Game</h1>
      <div class="player-name"></div>
      <div class="score"></div>
    </header>
    <div class="game-board">
      <section class="controls">
        <h1>CONTROL PANEL</h1>
        <fieldset class="speed">
          <legend>SPEED</legend>
          <input type="radio" name="speed" id="slow" value="slow" />
          <label for="slow">Slow</label>
          <input type="radio" name="speed" id="med" value="med" checked />
          <label for="med">Med</label>
          <input type="radio" name="speed" id="fast" value="fast" />
          <label for="fast">Fast</label>
        </fieldset>
        <fieldset class="sound">
          <legend>SOUND</legend>
          <input type="checkbox" name="sound" id="mute-sfx" value="sfx" />
          <label for="sfx">Mute SFX</label>
          <input type="checkbox" name="sound" id="mute-music" value="music" />
          <label for="music">Mute Music</label>
        </fieldset>
        <div class="leaderboard">
          <div class="leader-title"><h1>Leaderboard</h1></div>
          <div class="first-part">
            <div class="sec-part">
              <h3 class="title">Player Name</h3>
              <div class="player-names"></div>
            </div>
            <div class="sec-part">
              <h3 class="title">High Score</h3>
              <div class="high-scores"></div>
            </div>
          </div>
        </div>
        <div class="buttons">
          <button class="restart">Restart</button>
          <button class="pause">Pause</button>
        </div>
      </section>
      <section class="game">
        <div class="grids">
          <div class="easy-grid">
            <canvas id="easy-grid" width="400" height="400"></canvas>
          </div>
        </div>
        <div class="state-block pause-block">
          <img src="./assets/pic/snake-pics/block.gif" alt="dancing-snake" />
          <h2 class="pause-msg">GAME PAUSED</h2>
          <button class="resume">Resume</button>
        </div>
        <div class="state-block lose-block">
          <img src="/assets/pic/snake-pics/block.gif" alt="dancing-snake" />
          <h2 class="lose-msg">Hard Luck</h2>
          <button class="restart" id="restart">Play Again</button>
        </div>
      </section>
    </div>
  </body>
</html>
