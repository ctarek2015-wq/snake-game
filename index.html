<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/pic/snake-pics/favicon.png" />
    <title>NOT UR REGULAR SNAKE</title>
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="new-player-class" id="new-player">
      <h1>SNAKE GAME</h1>
      <div class="instructions">
        <h3>Instructions</h3>
        <ul>
          <li>Use arrows or (W,A,S,D) to move</li>
          <li>Press Esc to pause the game</li>
        </ul>
      </div>
      <div class="intro">
        <input
          type="text"
          id="player-name"
          placeholder="Enter Player Name"
          required
        />
        <button id="submit">Play</button>
      </div>
    </div>

    <div class="theme-window">
      <h1>THEME PICKER</h1>
      <div class="snake-body sub">
        <h3>Snake Body:</h3>
      </div>
      <div class="snake-body sub" id="theme-body-group">
        <button class="theme-selected">
          <img src="./assets/pic/snake-pics/basic-head.png" alt="basic-body" />
        </button>
        <button>
          <img src="./assets/pic/snake-pics/gold-body.png" alt="gold-body" />
        </button>
        <button>
          <img src="./assets/pic/snake-pics/xmas-body.png" alt="xmas-body" />
        </button>
        <button>
          <img
            src="./assets/pic/snake-pics/carnival-body.png"
            alt="carnival-body"
          />
        </button>
      </div>

      <div class="snake-head sub">
        <h3>Snake Head:</h3>
      </div>
      <div class="snake-head sub" id="theme-head-group">
        <button class="theme-selected">
          <img src="./assets/pic/snake-pics/basic-head.png" alt="basic-head" />
        </button>
        <button>
          <img src="./assets/pic/snake-pics/gold-head.png" alt="gold-head" />
        </button>
        <button>
          <img src="./assets/pic/snake-pics/xmas-head.png" alt="xmas-head" />
        </button>
        <button>
          <img
            src="./assets/pic/snake-pics/carnival-head.png"
            alt="carnival-head"
          />
        </button>
      </div>

      <div class="snake-food sub">
        <h3>Snake Food:</h3>
      </div>
      <div class="snake-food sub" id="theme-food-group">
        <button class="theme-selected">
          <img src="./assets/pic/snake-pics/basic-food.png" alt="basic-food" />
        </button>
        <button>
          <img src="./assets/pic/snake-pics/gold-food.png" alt="gold-food" />
        </button>
        <button>
          <img src="./assets/pic/snake-pics/xmas-food.png" alt="xmas-food" />
        </button>
        <button>
          <img
            src="./assets/pic/snake-pics/carnival-food.png"
            alt="carnival-food"
          />
        </button>
      </div>
      <button id="back">Back</button>
    </div>

    <header class="banner">
      <h1>Snake Game</h1>
      <div class="player-name">Welcome!</div>
      <div class="score">Score: 0</div>
    </header>

    <div class="game-board">
      <section class="controls">
        <h1>CONTROL PANEL</h1>
        <button class="themes-btn">Theme Picker</button>
        <fieldset class="speed">
          <legend>SPEED</legend>
          <input type="radio" name="speed" id="slow" value="slow" />
          <label for="slow">Slow</label>
          <input type="radio" name="speed" id="med" value="med" checked />
          <label for="med">Med</label>
          <input type="radio" name="speed" id="fast" value="fast" />
          <label for="fast">Fast</label>
        </fieldset>

        <fieldset class="sound">
          <legend>SOUND</legend>
          <input type="checkbox" name="sound" id="mute-sfx" value="sfx" />
          <label for="mute-sfx">Mute SFX</label>
          <input type="checkbox" name="sound" id="mute-music" value="music" />
          <label for="mute-music">Mute Music</label>
        </fieldset>

        <div class="leaderboard">
          <div class="leader-title"><h1>Leaderboard</h1></div>
          <div class="first-part">
            <div class="sec-part">
              <h3 class="title">Name</h3>
              <div class="player-names"></div>
            </div>
            <div class="sec-part">
              <h3 class="title">Score</h3>
              <div class="high-scores"></div>
            </div>
            <div class="sec-part">
              <h3 class="title">Speed</h3>
              <div class="leaderboard-speeds"></div>
            </div>
          </div>
        </div>

        <div class="buttons">
          <button class="restart">Restart</button>
          <button class="pause">Pause</button>
        </div>
      </section>

      <section class="game">
        <div class="grids">
          <div class="easy-grid">
            <canvas id="easy-grid-canvas" width="400" height="400"></canvas>
          </div>
        </div>

        <div class="state-block pause-block">
          <h2 class="pause-msg">GAME PAUSED</h2>
          <button class="resume">Resume</button>
        </div>

        <div class="state-block lose-block">
          <h2 class="lose-msg">Game Over</h2>
          <button class="restart" id="restart">Play Again</button>
          <button class="add-new-player">New Player</button>
        </div>
      </section>
    </div>
  </body>
</html>
